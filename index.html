  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

s */\n  --radius-none: 0px;\n  --radius-xs: 4px; /* buttons, inputs */\n  --radius-s: 8px;\n  --radius-m: 12px; /* cards */\n  --radius-l: 16px;\n  --radius-xl: 24px;\n  --radius-full: 9999px; /* pills, avatars */\n\n  /* Icon dimensions */\n  --size-icon-s: 16px;\n  --size-icon-m: 24px;\n  --size-icon-l: 48px;\n\n  /* Control dimensions */\n  --size-checkbox-s: 16px;\n  --size-checkbox-m: 24px;\n  --size-radio-s: 16px;\n  --size-radio-m: 24px;\n  --size-toggle-height-s: 16px;\n  --size-toggle-height-m: 24px;\n  --size-toggle-width-s: 28px;\n  --size-toggle-width-m: 40px;\n\n  /* Layout dimensions */\n  --size-content-max-width: 1024px;\n  --size-modal-width-m: 560px;\n  --size-modal-width-l: 720px;\n  --size-modal-max-height-l: 800px;\n  --size-dropdown-menu-width: 120px;\n\n  /* Breakpoints */\n  --breakpoint-s: 576px;\n  --breakpoint-m: 768px;\n  --breakpoint-l: 1024px;\n  --breakpoint-xl: 1280px;\n  --breakpoint-xxl: 1536px;\n\n  /* Opacity */\n  --opacity-hidden: 0; /* @kind other */\n  --opacity-disabled: 0.3; /* @kind other */\n  --opacity-hover: 0.6; /* @kind other */\n  --opacity-visible: 1; /* @kind other */\n\n  /* z-index */\n  --z-base: 0; /* @kind other */\n  --z-dropdown: 1; /* @kind other */\n  --z-tooltip: 2; /* @kind other */\n  --z-modal: 3; /* @kind other */\n}\n\n/* AMBOSS elevation & motion tokens.\n   Shadows are soft and low-contrast in light mode; in dark mode they pair a\n   drop shadow with a 1px inset hairline ring so cards separate from the canvas.\n   Motion is restrained — ease-in-out, 100/200/300ms. No bounces. */\n\n:root {\n  /* Elevation — light theme defaults; overridden in colors.css dark scope */\n  --elevation-1: 0px 0.3px 0.6px rgba(0, 0, 0, 0.0035),\n    0px 2px 5px rgba(0, 0, 0, 0.07);\n  --elevation-2: 0px 2px 8px 0px rgba(0, 0, 0, 0.12),\n    0px 0.3px 1px 0px rgba(0, 0, 0, 0.01);\n  --elevation-3: 0px 0.5px 2.5px rgba(0, 0, 0, 0.16),\n    0px 4px 20px rgba(0, 0, 0, 0.2);\n  --elevation-4: 0px 4px 14px rgba(0, 0, 0, 0.12),                         ECG\n                        <\u002Fa>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <!-- Footer -->\n                  <div style=\"display:flex;flex-direction:row;gap:4px;justify-content:flex-end;padding-top:8px;\">\n                    <button sc-camel-on-click=\"{{ handleReviewQuiz }}\" sc-camel-on-mouse-enter=\"{{ summaryHoverReview }}\" sc-camel-on-mouse-leave=\"{{ summaryHoverNone }}\" style=\"{{ summaryReviewBtnStyle }}\">Review quiz<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Scratch quiz notice — outside the quiz container, 8px below -->\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <span style=\"font-size:14px;line-height:20px;color:#5a7183;\">This is a scratch quiz. Leaving the chat will discard your answers and reset it.<\u002Fspan>\n            <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <\u002Fsc-if>\n\n        <!-- Follow-up messages -->\n        <sc-for list=\"{{ followupMessages }}\" as=\"msg\" hint-placeholder-count=\"0\">\n          <div data-msg-index=\"{{ $index }}\" style=\"display:flex;flex-direction:column;gap:8px;order:10;\">\n            <div style=\"max-width:min(80%,448px);margin-left:auto;background-color:#F5F7F9;border-radius:8px 0px 8px 8px;padding:12px 16px;font-family:Lato,sans-serif;font-size:14px;line-height:1.5;color:#1A1C1C;\">{{ msg.user }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px;order:10;\">\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <div style=\"width:24px;height:24px;border-radius:50%;background:#6934c4;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2L9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <span style=\"font-weight:900;font-size:16px;color:rgb(64,81,94);\">AI Mode Learning<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ msg.isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding-left:32px;display:flex;gap:5px;align-items:center;height:24px;\">\n                <div style=\"width:7px;height:7px;border-radius:50%;background:#6934c4;animation:pulse 1.2s ease-in-out infinite;animation-delay:0s;\"><\u002Fdiv>\n                <div style=\"width:7px;height:7px;border-radius:50%;background:#6934c4;animation:pulse 1.2s ease-in-out infinite;animation-delay:0.2s;\"><\u002Fdiv>\n                <div style=\"width:7px;height:7px;border-radius:50%;background:#6934c4;animation:pulse 1.2s ease-in-out infinite;animation-delay:0.4s;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ msg.hasAi }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-if value=\"{{ msg.isRecap }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding-left:32px;display:flex;flex-direction:column;gap:4px;animation:fadeUp 0.2s ease;\">\n                  <p style=\"margin:0 0 16px;font-size:15px;color:rgb(26,28,28);line-height:22px;\">Here is a recap of the quiz<\u002Fp>\n                  <p style=\"margin:0 0 16px;font-size:15px;font-weight:900;color:rgb(26,28,28);\">Topic: Cardiac physiology<\u002Fp>\n                  <sc-for list=\"{{ recapItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n                    <div style=\"margin-bottom:24px;display:flex;flex-direction:column;gap:6px;\">\n                      <p style=\"margin:0;font-weight:900;font-size:15px;color:rgb(26,28,28);\">Question {{ item.num }}<\u002Fp>\n                      <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);line-height:22px;\">{{ item.text }}<\u002Fp>\n                      <sc-if value=\"{{ item.usedHint }}\">\n                        <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);line-height:22px;\"><strong>Used hint:<\u002Fstrong> {{ item.hint }}<\u002Fp>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ item.isIncorrect }}\">\n                        <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);\"><strong>{{ item.selectedLabel }})<\u002Fstrong> {{ item.selectedText }} <strong>(YOUR INCORRECT ANSWER)<\u002Fstrong><\u002Fp>\n                        <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);\"><strong>{{ item.correctLabel }})<\u002Fstrong> {{ item.correctText }} <strong>(CORRECT ANSWER)<\u002Fstrong><\u002Fp>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ item.isCorrect }}\">\n                        <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);\"><strong>{{ item.selectedLabel }})<\u002Fstrong> {{ item.selectedText }} <strong>(YOUR CORRECT ANSWER)<\u002Fstrong><\u002Fp>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ item.skipped }}\">\n                        <p style=\"margin:0;font-size:15px;color:rgb(90,113,131);\">Not answered<\u002Fp>\n                        <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);\"><strong>{{ item.correctLabel }})<\u002Fstrong> {{ item.correctText }} <strong>(CORRECT ANSWER)<\u002Fstrong><\u002Fp>\n                      <\u002Fsc-if>\n                      <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);line-height:22px;\"><strong>Explanation:<\u002Fstrong> {{ item.explanation }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:8px;\">\n                    <p style=\"margin:0;font-weight:900;font-size:15px;color:rgb(26,28,28);\">Summary<\u002Fp>\n                    <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);\">You answered correctly <strong>{{ scorePct }}<\u002Fstrong>&nbsp; ({{ scoreFraction }})<\u002Fp>\n                    <p style=\"margin:0;font-size:15px;color:rgb(26,28,28);line-height:22px;\"><strong>Recommendation:<\u002Fstrong> Review the Frank-Starling mechanism and preload and afterload, then practice more cardiac physiology questions.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ msg.isFollowup }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding-left:32px;font-size:16px;color:rgb(26,28,28);line-height:24px;\">{{ msg.ai }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n\n      <\u002Fdiv>\n    \n  <\u002Fsc-if><\u002Fdiv>\n\n  <!-- ── BOTTOM PROMPT INPUT ── -->\n  <sc-if value=\"{{ showThread }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:0;left:0;right:0;background:white;padding:12px 24px 12px;display:flex;justify-content:center;z-index:20;\">\n    <div style=\"width:100%;max-width:800px;display:flex;flex-direction:column;gap:6px;\">\n      <div style=\"{{ promptBoxStyle }}\">\n        <textarea value=\"{{ inputValue }}\" sc-camel-on-input=\"{{ handleInput }}\" sc-camel-on-key-down=\"{{ handleKeyDown }}\" sc-camel-on-focus=\"{{ promptFocused }}\" sc-camel-on-blur=\"{{ promptBlurred }}\" placeholder=\"Ask a follow-up question...\" rows=\"1\" id=\"promptInput\" style=\"width: 100%; border: none; outline: none; font-size: 15px; font-family: Lato,sans-serif; color: rgb(26,28,28); background: transparent; resize: none; line-height: 1.5; display: block; box-sizing: border-box; padding: 0; margin-top: 8px; margin-bottom: 8px\"><\u002Ftextarea>\n        <!-- Clear button (only when input has content) -->\n        <sc-if value=\"{{ hasInput }}\">\n          <button sc-camel-on-click=\"{{ handleClear }}\" style=\"position:absolute;top:8px;right:8px;width:24px;height:24px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50;padding:0;\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(163,178,189)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"15\" y1=\"9\" x2=\"9\" y2=\"15\"><\u002Fline><line x1=\"9\" y1=\"9\" x2=\"15\" y2=\"15\"><\u002Fline><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        <!-- Send button -->\n        <button sc-camel-on-click=\"{{ handleSend }}\" style=\"{{ promptSendStyle }}\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"5\"><\u002Fline><polyline points=\"5 12 12 5 19 12\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  BANK = [\n    {\n      \"text\": \"A healthy 24-year-old male volunteer participates in a cardiovascular physiology study involving simultaneous echocardiography, electrocardiography, and central venous pressure monitoring. Which of the following events marks the end of the isovolumetric relaxation phase of the cardiac cycle in this subject?\",\n      \"hint\": \"\",\n      \"answers\": [\n        \"Peak of the c wave on the jugular venous pulse\",\n        \"Closure of the atrioventricular valves\",\n        \"Peak of the T wave on the electrocardiogram\",\n        \"Opening of the atrioventricular valves\"\n      ],\n      \"correct\": 3,\n      \"sources\": [\n        \"Cardiac physiology › Cardiac cycle\"\n      ],\n      \"section\": \"Cardiac cycle\",\n      \"explanations\": [\n        \"The c wave reflects tricuspid valve bulging into the right atrium during isovolumetric contraction, so it occurs at the start of systole.\",\n        \"AV valve closure marks the start of isovolumetric contraction, not the end of isovolumetric relaxation.\",\n        \"The T wave reflects ventricular repolarization and coincides with the end of ejection, which precedes isovolumetric relaxation.\",\n        \"The end of the isovolumetric relaxation phase in the cardiac cycle is characterized by the opening of the atrioventricular valves as ventricular pressure falls below atrial pressure.\"\n      ]\n    },\n    {\n      \"text\": \"A healthy 30-year-old man receives a rapid intravenous infusion of normal saline, leading to an increase in his left ventricular end-diastolic volume. Echocardiography demonstrates a subsequent proportional increase in his stroke volume. At the level of the cardiac myocyte, this physiological adaptation is best explained by which of the following?\",\n      \"hint\": \"\",\n      \"answers\": [\n        \"Stress-strain relationship\",\n        \"Force-velocity relationship\",\n        \"Length-tension relationship\",\n        \"Force-frequency relationship\"\n      ],\n      \"correct\": 2,\n      \"sources\": [\n        \"Cardiac physiology › Regulation of cardiac activity\"\n      ],\n      \"section\": \"Regulation of cardiac activity\",\n      \"explanations\": [\n        \"The stress-strain relationship describes tissue stiffness and compliance, not how stretch changes contractile force.\",\n        \"The force-velocity relationship describes how shortening velocity falls as load rises, which relates to afterload rather than preload.\",\n        \"The Frank-Starling law states that stroke volume depends on end-diastolic volume, illustrating the length-tension relationship where increased myocardial fiber stretch leads to a greater force of contraction.\",\n        \"The force-frequency relationship describes how contractility rises with heart rate, not with filling volume.\"\n      ]\n    },\n    {\n      \"text\": \"A student is reviewing a Wiggers diagram in a physiology laboratory. The student focuses on a phase of the cardiac cycle that begins immediately after the closure of the mitral valve. During this brief period, left ventricular pressure rises rapidly from approximately 10 mm Hg to 80 mm Hg before the aortic valve opens. Which of the following phases of the cardiac cycle is best described by these findings?\",\n      \"hint\": \"\",\n      \"answers\": [\n        \"Rapid ventricular filling\",\n        \"Isovolumetric relaxation\",\n        \"Ventricular ejection\",\n        \"Isovolumetric contraction\"\n      ],\n      \"correct\": 3,\n      \"sources\": [\n        \"Cardiac physiology › Cardiac cycle\"\n      ],\n      \"section\": \"Cardiac cycle\",\n      \"explanations\": [\n        \"Rapid ventricular filling follows mitral valve opening, when ventricular pressure falls below atrial pressure.\",\n        \"During isovolumetric relaxation, ventricular pressure falls with all valves closed after the aortic valve closes.\",\n        \"Ejection begins after the aortic valve opens, once ventricular pressure exceeds aortic pressure.\",\n        \"During the isovolumetric contraction phase of the cardiac cycle, ventricular pressure increases while all valves remain closed, resulting in a rapid rise in pressure with no change in volume.\"\n      ]\n    },\n    {\n      \"text\": \"A researcher is studying the electrical properties of an isolated nerve fiber. After applying a suprathreshold stimulus to elicit an action potential, a second suprathreshold stimulus is applied immediately afterward, but no action potential is generated. Which of the following mechanisms is primarily responsible for this observation?\",\n      \"hint\": \"\",\n      \"answers\": [\n        \"Closure of voltage-gated sodium channel inactivation gates\",\n        \"Opening of voltage-gated calcium channels\",\n        \"Closure of voltage-gated sodium channel activation gates\",\n        \"Closure of voltage-gated potassium channels\"\n      ],\n      \"correct\": 0,\n      \"sources\": [\n        \"Resting potentials and action potentials › Action potential\"\n      ],\n      \"section\": \"Action potential\",\n      \"explanations\": [\n        \"The absolute refractory period is mediated by the closure of inactivation gates on voltage-gated sodium channels, preventing the initiation of a subsequent action potential regardless of stimulus intensity.\",\n        \"Voltage-gated calcium channels contribute to the plateau of cardiac myocytes, but they do not cause the absolute refractory period of a nerve fiber.\",\n        \"Activation gates are open during depolarization. The second stimulus fails because the inactivation gates are closed.\",\n        \"Closure of potassium channels would prolong depolarization. Open potassium channels cause repolarization and underlie the relative refractory period.\"\n      ]\n    },\n    {\n      \"text\": \"A healthy 25-year-old man undergoes a routine electrocardiogram, which demonstrates a normal sinus rhythm with a rate of 72/min. In the normal cardiac conduction system, the electrical impulses driving this rhythm primarily originate in which of the following structures?\",\n      \"hint\": \"The structure responsible for setting the normal heart rate is located in the superior wall of the right atrium near the opening of the superior vena cava.\",\n      \"answers\": [\n        \"Bundle of His\",\n        \"Purkinje fibers\",\n        \"Atrioventricular node\",\n        \"Sinoatrial node\"\n      ],\n      \"correct\": 3,\n      \"sources\": [\n        \"Cardiac physiology › Cardiac conduction system\"\n      ],\n      \"section\": \"Cardiac conduction system\",\n      \"explanations\": [\n        \"The bundle of His conducts impulses from the AV node to the ventricles and is not the primary pacemaker.\",\n        \"Purkinje fibers conduct impulses rapidly through the ventricles. They pace the heart only if higher sites fail.\",\n        \"The AV node delays conduction between atria and ventricles and has a slower intrinsic rate than the sinoatrial node.\",\n        \"In the cardiac conduction system, the electrical impulse normally originates in the sinoatrial node, which serves as the heart's primary physiological pacemaker.\"\n      ]\n    },\n    {\n      \"text\": \"A healthy 30-year-old man participates in a cardiovascular physiology study. When his mean arterial blood pressure is acutely elevated using an intravenous infusion, his heart rate reflexively decreases. This compensatory chronotropic response is primarily mediated by the release of which of the following neurotransmitters at the sinoatrial node?\",\n      \"hint\": \"\",\n      \"answers\": [\n        \"Acetylcholine\",\n        \"Dopamine\",\n        \"Epinephrine\",\n        \"Norepinephrine\"\n      ],\n      \"correct\": 0,\n      \"sources\": [\n        \"Vascular physiology › Regulation of blood pressure\"\n      ],\n      \"section\": \"Regulation of blood pressure\",\n      \"explanations\": [\n        \"During the baroreceptor reflex response to elevated blood pressure, the parasympathetic nervous system releases acetylcholine onto the sinoatrial node to induce bradycardia.\",\n        \"Dopamine does not mediate the baroreceptor reflex at the sinoatrial node.\",\n        \"Epinephrine increases heart rate through beta-1 receptors, the opposite of this response.\",\n        \"Norepinephrine from sympathetic fibers increases heart rate. A pressure rise reduces sympathetic outflow.\"\n      ]\n    }\n  ];\n  get QUESTIONS() { const n = this.state.selectedQCount || 5; return Array.from({ length: n }, (_, i) => this.BANK[i % this.BANK.length]); }\n\n  componentDidMount() {\n
